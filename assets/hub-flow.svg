</defs><rect width="1200" height="400" rx="16" fill="#0f0f10"/><rect width="1200" height="400" rx="16" fill="url(#glowA)"/><rect width="1200" height="400" rx="16" fill="url(#glowB)"/><rect x=".5" y=".5" width="1199" height="399" rx="16" fill="none" stroke="#26262b"/><rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#bar)"/><rect x="540.6" y="32" width="118.80000000000001" height="26" rx="13" fill="#141416" stroke="#34343a"/><text x="600" y="49" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2" fill="#9a9aa2">HOW IT WORKS</text><text x="600" y="106" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" letter-spacing="-1.2" fill="#f2f2f3">Reviewed before listed,</text><text x="600" y="150" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" letter-spacing="-1.2" fill="url(#g)">verified before installed.</text><text x="600" y="180" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#8a8a93">Nothing from a submission is executed. Every file is checked against its sha256.</text><line x1="250" y1="225" x2="380" y2="225" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.5"/><line x1="440" y1="225" x2="570" y2="225" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.5"/><line x1="630" y1="225" x2="760" y2="225" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.5"/><line x1="820" y1="225" x2="950" y2="225" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.5"/><g opacity="1"><rect x="198" y="203" width="44" height="44" rx="12" fill="#3b82f6" opacity=".5" filter="url(#blur)"/><rect x="198" y="203" width="44" height="44" rx="12" fill="#121316" stroke="#3b82f6" stroke-opacity="0.8" stroke-width="1.3"/><g transform="translate(220 225) scale(.85)" fill="none" stroke="#5b9bff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="-6" cy="-7" r="2.5"/><circle cx="-6" cy="7" r="2.5"/><circle cx="7" cy="7" r="2.5"/><path d="M-6 -4.5v9M7 4.5V-2q0-4-4-4H0M2 -9l-3 3 3 3"/></g><text x="220" y="267" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1" fill="#6c6c75">01</text><text x="220" y="289" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f2f2f3">Pull request</text><text x="220" y="311" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">A contributor adds a</text><text x="220" y="328" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">skill, agent or plugin</text><text x="220" y="345" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">entry.</text></g><g opacity="1"><rect x="388" y="203" width="44" height="44" rx="12" fill="#3b82f6" opacity=".5" filter="url(#blur)"/><rect x="388" y="203" width="44" height="44" rx="12" fill="#121316" stroke="#3b82f6" stroke-opacity="0.8" stroke-width="1.3"/><g transform="translate(410 225) scale(.85)" fill="none" stroke="#5b9bff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10l9 3v6q0 7-9 11-9-4-9-11v-6z"/><path d="M-4 0l3 3 5-6"/></g><text x="410" y="267" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1" fill="#6c6c75">02</text><text x="410" y="289" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f2f2f3">CI checks</text><text x="410" y="311" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">Format validated; plugins</text><text x="410" y="328" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">fetched at the pinned</text><text x="410" y="345" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">commit and compared.</text></g><g opacity="1"><rect x="578" y="203" width="44" height="44" rx="12" fill="#3b82f6" opacity=".5" filter="url(#blur)"/><rect x="578" y="203" width="44" height="44" rx="12" fill="#121316" stroke="#3b82f6" stroke-opacity="0.8" stroke-width="1.3"/><g transform="translate(600 225) scale(.85)" fill="none" stroke="#5b9bff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 0q11-13 22 0-11 13-22 0z"/><circle cx="0" cy="0" r="3.5"/></g><text x="600" y="267" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1" fill="#6c6c75">03</text><text x="600" y="289" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f2f2f3">Review</text><text x="600" y="311" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">A maintainer reads the</text><text x="600" y="328" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">content and merges.</text></g><g opacity="1"><rect x="768" y="203" width="44" height="44" rx="12" fill="#3b82f6" opacity=".5" filter="url(#blur)"/><rect x="768" y="203" width="44" height="44" rx="12" fill="#121316" stroke="#3b82f6" stroke-opacity="0.8" stroke-width="1.3"/><g transform="translate(790 225) scale(.85)" fill="none" stroke="#5b9bff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-6" rx="9" ry="3.5"/><path d="M-9 -6v12q0 3.5 9 3.5t9-3.5V-6M-9 0q0 3.5 9 3.5t9-3.5"/></g><text x="790" y="267" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1" fill="#6c6c75">04</text><text x="790" y="289" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f2f2f3">Index</text><text x="790" y="311" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">index.json regenerated</text><text x="790" y="328" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">with sizes and sha256</text><text x="790" y="345" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">per file.</text></g><g opacity="1"><rect x="958" y="203" width="44" height="44" rx="12" fill="#3b82f6" opacity=".5" filter="url(#blur)"/><rect x="958" y="203" width="44" height="44" rx="12" fill="#121316" stroke="#3b82f6" stroke-opacity="0.8" stroke-width="1.3"/><g transform="translate(980 225) scale(.85)" fill="none" stroke="#5b9bff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10v14M-6 -2l6 6 6-6M-9 9h18"/></g><text x="980" y="267" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1" fill="#6c6c75">05</text><text x="980" y="289" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f2f2f3">Install</text><text x="980" y="311" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">devkit downloads from the</text><text x="980" y="328" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">commit and refuses any</text><text x="980" y="345" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8a8a93">hash mismatch.</text></g></svg>